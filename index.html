<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Tung Tung Tung Sahur</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
}

canvas {
    display: block;
}

#menu {
    position: absolute;
    width: 100%;
    top: 22%;
    text-align: center;
    color: white;
    z-index: 10;
}

#menu h1 {
    font-size: 60px;
    margin-bottom: 10px;
}

#menu p {
    font-size: 24px;
}

button {
    padding: 15px 40px;
    font-size: 24px;
    border: none;
    border-radius: 10px;
    background: red;
    color: white;
    cursor: pointer;
    margin-top: 20px;
}

#message {
    position: absolute;
    width: 100%;
    top: 40%;
    text-align: center;
    color: white;
    font-size: 60px;
    display: none;
    z-index: 20;
}
</style>
</head>
<body>

<div id="menu">
    <h1>ESCAPE TUNG TUNG TUNG SAHUR</h1>

    <p>WASD to move</p>
    <p>Move mouse to look around</p>
    <p>Escape the maze before Tung catches you</p>

    <button onclick="startGame()">START GAME</button>
</div>

<div id="message"></div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let started = false;
let gameOver = false;

let keys = {};

const tileSize = 64;

const maze = [
"111111111111111111111111111",
"1000000000000010000000000E1",
"101111111111101011111111101",
"101000000001101010000001101",
"101011111101101010111101101",
"101010001101001010100001101",
"101010101111111010101111101",
"101010100000001010100000101",
"101010111111101010111110101",
"101010100000101010100010101",
"101110101110101010101010101",
"100000101000101000001010101",
"101111101011111111111010101",
"101000001000000000001010101",
"101011111111111111101010101",
"101010000000000000101010101",
"101010111111111110101010101",
"101010100000000010001010101",
"101010101111111011111010101",
"101000101000001000000010101",
"101111101011101111111110101",
"100000001010100000000000101",
"101111111010111111111110101",
"100000000000000000000000001",
"111111111111111111111111111"
];

const player = {
    x: 96,
    y: 96,
    angle: 0,
    speed: 2.8
};

const tung = {
    x: 1500,
    y: 1400,
    speed: 1.6
};

function startGame() {

    started = true;

    document.getElementById("menu").style.display = "none";

    canvas.requestPointerLock();
}

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

document.addEventListener("mousemove", e => {

    if (
        document.pointerLockElement === canvas &&
        started &&
        !gameOver
    ) {
        player.angle += e.movementX * 0.003;
    }
});

function wallAt(x, y) {

    const mapX = Math.floor(x / tileSize);
    const mapY = Math.floor(y / tileSize);

    if (
        mapY < 0 ||
        mapY >= maze.length ||
        mapX < 0 ||
        mapX >= maze[0].length
    ) {
        return true;
    }

    return maze[mapY][mapX] === "1";
}

function update() {

    if (!started || gameOver) return;

    let moveX = 0;
    let moveY = 0;

    if (keys["w"]) {
        moveX += Math.cos(player.angle) * player.speed;
        moveY += Math.sin(player.angle) * player.speed;
    }

    if (keys["s"]) {
        moveX -= Math.cos(player.angle) * player.speed;
        moveY -= Math.sin(player.angle) * player.speed;
    }

    if (keys["a"]) {
        moveX += Math.cos(player.angle - Math.PI/2) * player.speed;
        moveY += Math.sin(player.angle - Math.PI/2) * player.speed;
    }

    if (keys["d"]) {
        moveX += Math.cos(player.angle + Math.PI/2) * player.speed;
        moveY += Math.sin(player.angle + Math.PI/2) * player.speed;
    }

    // player collision
    if (!wallAt(player.x + moveX, player.y)) {
        player.x += moveX;
    }

    if (!wallAt(player.x, player.y + moveY)) {
        player.y += moveY;
    }

    // tung movement
    const dx = player.x - tung.x;
    const dy = player.y - tung.y;

    const dist = Math.hypot(dx, dy);

    const mx = (dx / dist) * tung.speed;
    const my = (dy / dist) * tung.speed;

    if (!wallAt(tung.x + mx, tung.y)) {
        tung.x += mx;
    }

    if (!wallAt(tung.x, tung.y + my)) {
        tung.y += my;
    }

    if (dist < 40) {
        loseGame();
    }

    // exit check
    const mapX = Math.floor(player.x / tileSize);
    const mapY = Math.floor(player.y / tileSize);

    if (maze[mapY][mapX] === "E") {
        winGame();
    }
}

function castRays() {

    for (let x = 0; x < canvas.width; x++) {

        const rayAngle =
            player.angle - 0.6 +
            (x / canvas.width) * 1.2;

        for (let depth = 0; depth < 1200; depth++) {

            const rayX =
                player.x + Math.cos(rayAngle) * depth;

            const rayY =
                player.y + Math.sin(rayAngle) * depth;

            if (wallAt(rayX, rayY)) {

                const wallHeight =
                    70000 / (depth + 1);

                const shade =
                    Math.max(40, 255 - depth / 4);

                ctx.fillStyle =
                    `rgb(${shade},0,0)`;

                ctx.fillRect(
                    x,
                    canvas.height/2 - wallHeight/2,
                    1,
                    wallHeight
                );

                break;
            }
        }
    }
}

function drawTung() {

    const dx = tung.x - player.x;
    const dy = tung.y - player.y;

    const distance = Math.hypot(dx, dy);

    const angle =
        Math.atan2(dy, dx) - player.angle;

    if (Math.abs(angle) < 0.6) {

        const size = 5000 / distance;

        const screenX =
            canvas.width/2 +
            Math.tan(angle) * 700;

        // legs
        ctx.strokeStyle = "#7a4a21";
        ctx.lineWidth = size/8;

        ctx.beginPath();

        ctx.moveTo(
            screenX - size/6,
            canvas.height/2 + size/2
        );

        ctx.lineTo(
            screenX - size/4,
            canvas.height/2 + size
        );

        ctx.moveTo(
            screenX + size/6,
            canvas.height/2 + size/2
        );

        ctx.lineTo(
            screenX + size/4,
            canvas.height/2 + size
        );

        ctx.stroke();

        // body
        ctx.fillStyle = "#9b5d2e";

        ctx.fillRect(
            screenX - size/5,
            canvas.height/2 - size/4,
            size/2.5,
            size
        );

        // head
        ctx.fillStyle = "#d18a4f";

        ctx.beginPath();

        ctx.arc(
            screenX,
            canvas.height/2 - size/2,
            size/2.8,
            0,
            Math.PI * 2
        );

        ctx.fill();

        // eyes
        ctx.fillStyle = "white";

        ctx.beginPath();

        ctx.arc(
            screenX - size/7,
            canvas.height/2 - size/2,
            size/11,
            0,
            Math.PI * 2
        );

        ctx.arc(
            screenX + size/7,
            canvas.height/2 - size/2,
            size/11,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "black";

        ctx.beginPath();

        ctx.arc(
            screenX - size/7,
            canvas.height/2 - size/2,
            size/25,
            0,
            Math.PI * 2
        );

        ctx.arc(
            screenX + size/7,
            canvas.height/2 - size/2,
            size/25,
            0,
            Math.PI * 2
        );

        ctx.fill();

        // mouth
        ctx.strokeStyle = "black";
        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            screenX,
            canvas.height/2 - size/2 + size/8,
            size/10,
            0,
            Math.PI
        );

        ctx.stroke();
    }
}

function drawFrames() {

    for (let y = 0; y < maze.length; y++) {

        for (let x = 0; x < maze[y].length; x++) {

            if (
                maze[y][x] === "1" &&
                (x + y) % 8 === 0
            ) {

                const fx = x * tileSize + 32;
                const fy = y * tileSize + 32;

                const dx = fx - player.x;
                const dy = fy - player.y;

                const distance = Math.hypot(dx, dy);

                const angle =
                    Math.atan2(dy, dx) - player.angle;

                if (Math.abs(angle) < 0.5) {

                    const size = 1000 / distance;

                    const screenX =
                        canvas.width/2 +
                        Math.tan(angle) * 600;

                    // frame
                    ctx.fillStyle = "#5c3b16";

                    ctx.fillRect(
                        screenX - size/2,
                        canvas.height/2 - size/2,
                        size,
                        size
                    );

                    // face
                    ctx.fillStyle = "#d18a4f";

                    ctx.beginPath();

                    ctx.arc(
                        screenX,
                        canvas.height/2,
                        size/3,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();
                }
            }
        }
    }
}

function drawMiniMap() {

    const scale = 6;

    for (let y = 0; y < maze.length; y++) {

        for (let x = 0; x < maze[y].length; x++) {

            if (maze[y][x] === "1") {
                ctx.fillStyle = "white";
            }
            else if (maze[y][x] === "E") {
                ctx.fillStyle = "lime";
            }
            else {
                ctx.fillStyle = "#222";
            }

            ctx.fillRect(
                x * scale + 15,
                y * scale + 15,
                scale,
                scale
            );
        }
    }

    // player
    ctx.fillStyle = "red";

    ctx.fillRect(
        (player.x / tileSize) * scale + 13,
        (player.y / tileSize) * scale + 13,
        5,
        5
    );

    // tung
    ctx.fillStyle = "orange";

    ctx.fillRect(
        (tung.x / tileSize) * scale + 13,
        (tung.y / tileSize) * scale + 13,
        5,
        5
    );
}

function draw() {

    // sky
    ctx.fillStyle = "#111";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height/2
    );

    // floor
    ctx.fillStyle = "#222";
    ctx.fillRect(
        0,
        canvas.height/2,
        canvas.width,
        canvas.height/2
    );

    if (started) {

        castRays();

        drawFrames();

        drawTung();

        drawMiniMap();

        // crosshair
        ctx.strokeStyle = "white";

        ctx.beginPath();

        ctx.moveTo(
            canvas.width/2 - 10,
            canvas.height/2
        );

        ctx.lineTo(
            canvas.width/2 + 10,
            canvas.height/2
        );

        ctx.moveTo(
            canvas.width/2,
            canvas.height/2 - 10
        );

        ctx.lineTo(
            canvas.width/2,
            canvas.height/2 + 10
        );

        ctx.stroke();
    }
}

function loseGame() {

    gameOver = true;

    document.exitPointerLock();

    const msg = document.getElementById("message");

    msg.style.display = "block";

    msg.innerText =
        "TUNG TUNG TUNG SAHUR GOT YOU";
}

function winGame() {

    gameOver = true;

    document.exitPointerLock();

    const msg = document.getElementById("message");

    msg.style.display = "block";

    msg.innerText =
        "YOU ESCAPED";
}

function gameLoop() {

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
