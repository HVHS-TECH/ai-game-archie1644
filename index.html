<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }
    canvas {
      border-radius: 12px;
      cursor: pointer;
      display: block;
    }
    p {
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <canvas id="c" width="400" height="550"></canvas>
  <p>Click or press Space to flap</p>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const W = 400, H = 550;
    const GAP = 175, PIPE_W = 52, SPEED = 1.8, GRAVITY = 0.25, FLAP = -6;
    let bird, pipes, score, best, state, frame;

    function init() {
      bird = { x: 80, y: H / 2, vy: 0, r: 14 };
      pipes = [];
      score = 0;
      frame = 0;
      state = 'waiting';
      best = best || 0;
    }

    function addPipe() {
      const minY = 80, maxY = H - 80 - GAP;
      const topH = Math.random() * (maxY - minY) + minY;
      pipes.push({ x: W, topH });
    }

    function flap() {
      if (state === 'waiting') state = 'playing';
      if (state === 'playing') bird.vy = FLAP;
      if (state === 'dead') init();
    }

    canvas.addEventListener('click', flap);
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); flap(); }
    });

    function drawBird() {
      const x = bird.x, y = bird.y;
      ctx.save();
      ctx.translate(x, y);
      const tilt = Math.min(Math.max(bird.vy * 3, -25), 70);
      ctx.rotate(tilt * Math.PI / 180);

      // Body
      ctx.fillStyle = '#F5C842';
      ctx.beginPath(); ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2); ctx.fill();

      // Belly
      ctx.fillStyle = '#E8A000';
      ctx.beginPath(); ctx.ellipse(4, 5, 14, 9, 0, 0, Math.PI * 2); ctx.fill();

      // Eye white
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(7, -4, 6, 0, Math.PI * 2); ctx.fill();

      // Pupil
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(9, -5, 3, 0, Math.PI * 2); ctx.fill();

      // Beak
      ctx.fillStyle = '#FF6B35';
      ctx.beginPath();
      ctx.moveTo(18, 2); ctx.lineTo(28, -2); ctx.lineTo(18, 6);
      ctx.closePath(); ctx.fill();

      // Wing
      const wing = state === 'playing' ? Math.sin(frame * 0.3) * 6 : 0;
      ctx.fillStyle = '#E8A000';
      ctx.beginPath(); ctx.ellipse(-4, 2 + wing, 9, 5, -0.3, 0, Math.PI * 2); ctx.fill();

      ctx.restore();
    }

    function drawPipe(p) {
      const grad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
      grad.addColorStop(0, '#3CB043');
      grad.addColorStop(0.4, '#5DD460');
      grad.addColorStop(1, '#2A8A30');
      ctx.fillStyle = grad;

      // Top pipe body
      ctx.beginPath();
      ctx.roundRect(p.x, 0, PIPE_W, p.topH - 12, [0, 0, 6, 6]);
      ctx.fill();

      // Top pipe cap
      ctx.fillStyle = '#2A8A30';
      ctx.fillRect(p.x - 5, p.topH - 24, PIPE_W + 10, 24);

      // Bottom pipe body
      const botY = p.topH + GAP;
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(p.x, botY + 24, PIPE_W, H - botY - 24, [6, 6, 0, 0]);
      ctx.fill();

      // Bottom pipe cap
      ctx.fillStyle = '#2A8A30';
      ctx.fillRect(p.x - 5, botY, PIPE_W + 10, 24);
    }

    function drawBg() {
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#87CEEB');
      sky.addColorStop(0.7, '#B8E0F0');
      sky.addColorStop(1, '#D4EDD8');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Clouds
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      const clouds = [[60, 80, 50], [200, 50, 70], [320, 90, 45], [130, 140, 35]];
      clouds.forEach(([cx, cy, cr]) => {
        ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + cr * 0.7, cy + 5, cr * 0.7, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx - cr * 0.6, cy + 5, cr * 0.65, 0, Math.PI * 2); ctx.fill();
      });

      // Ground
      ctx.fillStyle = '#7EC850';
      ctx.fillRect(0, H - 28, W, 28);
      ctx.fillStyle = '#5EA832';
      ctx.fillRect(0, H - 28, W, 6);
    }

    function checkCollision(p) {
      const bx = bird.x, by = bird.y, r = bird.r - 3;
      const inX = bx + r > p.x + 4 && bx - r < p.x + PIPE_W - 4;
      const hitTop = by - r < p.topH;
      const hitBot = by + r > p.topH + GAP;
      return inX && (hitTop || hitBot);
    }

    function loop() {
      ctx.clearRect(0, 0, W, H);
      drawBg();

      if (state === 'playing') {
        frame++;
        bird.vy += GRAVITY;
        bird.y += bird.vy;

        if (frame % 80 === 0) addPipe();
        pipes.forEach(p => p.x -= SPEED);
        pipes = pipes.filter(p => p.x + PIPE_W > -10);
        pipes.forEach(p => {
          if (!p.scored && p.x + PIPE_W < bird.x) { score++; p.scored = true; }
        });

        if (bird.y + bird.r > H - 28 || bird.y - bird.r < 0 || pipes.some(checkCollision)) {
          state = 'dead';
          if (score > best) best = score;
        }
      }

      pipes.forEach(drawPipe);
      drawBird();

      ctx.textAlign = 'center';

      if (state === 'waiting') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.roundRect(100, 200, 200, 90, 12);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '500 20px system-ui';
        ctx.fillText('Flappy Bird', W / 2, 232);
        ctx.font = '400 14px system-ui';
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.fillText('Click or Space to start', W / 2, 260);
        ctx.fillText('Best: ' + best, W / 2, 280);
      }

      if (state === 'playing' || state === 'dead') {
        ctx.shadowColor = 'rgba(0,0,0,0.4)';
        ctx.shadowBlur = 4;
        ctx.fillStyle = '#fff';
        ctx.font = '500 36px system-ui';
        ctx.fillText(score, W / 2, 55);
        ctx.shadowBlur = 0;
      }

      if (state === 'dead') {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.roundRect(90, 185, 220, 115, 12);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '500 22px system-ui';
        ctx.fillText('Game Over', W / 2, 215);
        ctx.font = '400 15px system-ui';
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillText('Score: ' + score + '  Best: ' + best, W / 2, 245);
        ctx.fillStyle = '#F5C842';
        ctx.beginPath();
        ctx.roundRect(145, 262, 110, 30, 8);
        ctx.fill();
        ctx.fillStyle = '#333';
        ctx.font = '500 14px system-ui';
        ctx.fillText('Click to restart', W / 2, 282);
      }

      requestAnimationFrame(loop);
    }

    init();
    loop();
  </script>
</body>
</html>
