<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Invaders</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    margin: auto;
    background: linear-gradient(#000010, #000);
}

#menu {
    position: absolute;
    width: 100%;
    top: 40%;
    text-align: center;
    color: white;
}

#menu h1 {
    font-size: 60px;
    margin-bottom: 10px;
}

#menu p {
    font-size: 24px;
}

button {
    padding: 15px 40px;
    font-size: 24px;
    border: none;
    border-radius: 10px;
    background: lime;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: rgb(0, 200, 0);
}
</style>
</head>
<body>

<div id="menu">
    <h1>SPACE INVADERS</h1>
    <p>A and D to Move</p>
    <p>Space to Shoot</p>
    <button onclick="startGame()">START GAME</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 900;
canvas.height = 600;

let gameStarted = false;

let keys = {};
let bullets = [];
let enemies = [];
let stars = [];

let score = 0;
let level = 1;
let gameOver = false;
let enemySpeed = 1.2;
let direction = 1;

const player = {
    x: canvas.width / 2 - 30,
    y: canvas.height - 80,
    width: 60,
    height: 40,
    speed: 6
};

document.addEventListener("keydown", e => {

    keys[e.key] = true;

    if (
        e.code === "Space" &&
        !e.repeat &&
        !gameOver &&
        gameStarted
    ) {

        bullets.push({
            x: player.x + player.width / 2 - 2,
            y: player.y,
            width: 4,
            height: 12,
            speed: 8
        });
    }

    if (gameOver && e.key.toLowerCase() === "r") {
        restartGame();
    }
});

document.addEventListener("keyup", e => {
    keys[e.key] = false;
});

for (let i = 0; i < 100; i++) {

    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2
    });
}

function startGame() {

    gameStarted = true;

    document.getElementById("menu").style.display = "none";
}

function createEnemies() {

    enemies = [];

    const rows = Math.min(2 + level, 5);

    for (let row = 0; row < rows; row++) {

        for (let col = 0; col < 8; col++) {

            enemies.push({
                x: 120 + col * 80,
                y: 50 + row * 60,
                width: 40,
                height: 40,
                alive: true
            });
        }
    }
}

createEnemies();

function update() {

    if (!gameStarted || gameOver) return;

    if ((keys["a"] || keys["A"]) && player.x > 0) {
        player.x -= player.speed;
    }

    if ((keys["d"] || keys["D"]) && player.x + player.width < canvas.width) {
        player.x += player.speed;
    }

    bullets.forEach((bullet, i) => {

        bullet.y -= bullet.speed;

        if (bullet.y < 0) {
            bullets.splice(i, 1);
        }
    });

    let hitEdge = false;

    enemies.forEach(enemy => {

        if (!enemy.alive) return;

        enemy.x += enemySpeed * direction;

        if (enemy.x <= 0 || enemy.x + enemy.width >= canvas.width) {
            hitEdge = true;
        }

        if (enemy.y + enemy.height >= player.y) {
            gameOver = true;
        }
    });

    if (hitEdge) {

        direction *= -1;

        enemies.forEach(enemy => {
            enemy.y += 20;
        });
    }

    bullets.forEach((bullet, bi) => {

        enemies.forEach(enemy => {

            if (
                enemy.alive &&
                bullet.x < enemy.x + enemy.width &&
                bullet.x + bullet.width > enemy.x &&
                bullet.y < enemy.y + enemy.height &&
                bullet.y + bullet.height > enemy.y
            ) {

                enemy.alive = false;
                score += 10;

                bullets.splice(bi, 1);
            }
        });
    });

    const aliveEnemies = enemies.filter(e => e.alive);

    if (aliveEnemies.length === 0) {

        level++;
        enemySpeed += 0.4;

        createEnemies();
    }
}

function drawPlayer() {

    ctx.fillStyle = "lime";

    ctx.beginPath();
    ctx.moveTo(player.x + player.width / 2, player.y);
    ctx.lineTo(player.x, player.y + player.height);
    ctx.lineTo(player.x + player.width, player.y + player.height);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "cyan";
    ctx.fillRect(player.x + 22, player.y + 10, 16, 10);
}

function drawEnemy(enemy) {

    ctx.fillStyle = "red";

    ctx.fillRect(enemy.x + 5, enemy.y + 10, 30, 20);

    ctx.fillRect(enemy.x + 10, enemy.y, 20, 10);

    ctx.fillRect(enemy.x + 5, enemy.y + 30, 5, 8);
    ctx.fillRect(enemy.x + 30, enemy.y + 30, 5, 8);

    ctx.fillStyle = "white";

    ctx.fillRect(enemy.x + 10, enemy.y + 15, 4, 4);
    ctx.fillRect(enemy.x + 26, enemy.y + 15, 4, 4);
}

function draw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    stars.forEach(star => {

        ctx.fillStyle = "white";
        ctx.fillRect(star.x, star.y, star.size, star.size);
    });

    if (gameStarted) {

        drawPlayer();

        bullets.forEach(bullet => {

            ctx.fillStyle = "yellow";
            ctx.fillRect(
                bullet.x,
                bullet.y,
                bullet.width,
                bullet.height
            );
        });

        enemies.forEach(enemy => {

            if (enemy.alive) {
                drawEnemy(enemy);
            }
        });

        ctx.fillStyle = "white";
        ctx.font = "28px Arial";

        ctx.fillText("Score: " + score, 20, 40);
        ctx.fillText("Level: " + level, 20, 80);
    }

    if (gameOver) {

        ctx.fillStyle = "red";
        ctx.font = "60px Arial";
        ctx.fillText("GAME OVER", 240, 280);

        ctx.fillStyle = "white";
        ctx.font = "30px Arial";
        ctx.fillText("Press R to Restart", 300, 340);
    }
}

function restartGame() {

    score = 0;
    level = 1;
    enemySpeed = 1.2;
    bullets = [];
    gameOver = false;

    createEnemies();
}

function gameLoop() {

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
