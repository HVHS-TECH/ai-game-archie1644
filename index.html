<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escape Tung Tung Tung Sahur</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
    font-family: Arial;
}

canvas {
    display: block;
}

#menu {
    position: absolute;
    width: 100%;
    top: 30%;
    text-align: center;
    color: white;
}

#menu h1 {
    font-size: 60px;
}

#menu p {
    font-size: 24px;
}

button {
    padding: 15px 40px;
    font-size: 24px;
    border: none;
    border-radius: 10px;
    background: red;
    color: white;
    cursor: pointer;
}

#message {
    position: absolute;
    width: 100%;
    top: 40%;
    text-align: center;
    color: white;
    font-size: 60px;
    display: none;
}
</style>
</head>
<body>

<div id="menu">
    <h1>ESCAPE TUNG TUNG TUNG SAHUR</h1>

    <p>WASD to move</p>
    <p>Hold Right Click to look around</p>
    <p>Find the green exit before he catches you</p>

    <button onclick="startGame()">START</button>
</div>

<div id="message"></div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let started = false;
let gameOver = false;

let keys = {};
let looking = false;

const maze = [
"111111111111",
"100000000001",
"101111111101",
"100000100001",
"111110101101",
"100010000001",
"101011111101",
"101000000001",
"101111111101",
"1000000000E1",
"111111111111"
];

const tileSize = 64;

const player = {
    x: 100,
    y: 100,
    angle: 0
};

const monster = {
    x: 500,
    y: 500,
    speed: 1.2
};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

document.addEventListener("contextmenu", e => {
    e.preventDefault();
});

document.addEventListener("mousedown", e => {

    if (e.button === 2) {
        looking = true;
    }
});

document.addEventListener("mouseup", e => {

    if (e.button === 2) {
        looking = false;
    }
});

document.addEventListener("mousemove", e => {

    if (looking && started && !gameOver) {
        player.angle += e.movementX * 0.003;
    }
});

function startGame() {

    started = true;

    document.getElementById("menu").style.display = "none";
}

function wallAt(x, y) {

    const mapX = Math.floor(x / tileSize);
    const mapY = Math.floor(y / tileSize);

    if (
        mapY < 0 ||
        mapY >= maze.length ||
        mapX < 0 ||
        mapX >= maze[0].length
    ) {
        return true;
    }

    return maze[mapY][mapX] === "1";
}

function update() {

    if (!started || gameOver) return;

    let moveX = 0;
    let moveY = 0;

    const speed = 2.5;

    if (keys["w"]) {
        moveX += Math.cos(player.angle) * speed;
        moveY += Math.sin(player.angle) * speed;
    }

    if (keys["s"]) {
        moveX -= Math.cos(player.angle) * speed;
        moveY -= Math.sin(player.angle) * speed;
    }

    if (keys["a"]) {
        moveX += Math.cos(player.angle - Math.PI/2) * speed;
        moveY += Math.sin(player.angle - Math.PI/2) * speed;
    }

    if (keys["d"]) {
        moveX += Math.cos(player.angle + Math.PI/2) * speed;
        moveY += Math.sin(player.angle + Math.PI/2) * speed;
    }

    if (!wallAt(player.x + moveX, player.y)) {
        player.x += moveX;
    }

    if (!wallAt(player.x, player.y + moveY)) {
        player.y += moveY;
    }

    // monster AI
    const dx = player.x - monster.x;
    const dy = player.y - monster.y;

    const dist = Math.hypot(dx, dy);

    monster.x += (dx / dist) * monster.speed;
    monster.y += (dy / dist) * monster.speed;

    if (dist < 25) {
        loseGame();
    }

    // exit
    const mapX = Math.floor(player.x / tileSize);
    const mapY = Math.floor(player.y / tileSize);

    if (maze[mapY][mapX] === "E") {
        winGame();
    }
}

function castRays() {

    for (let x = 0; x < canvas.width; x++) {

        const rayAngle =
            player.angle - 0.5 + (x / canvas.width);

        for (let depth = 0; depth < 800; depth++) {

            const rayX =
                player.x + Math.cos(rayAngle) * depth;

            const rayY =
                player.y + Math.sin(rayAngle) * depth;

            if (wallAt(rayX, rayY)) {

                const wallHeight =
                    40000 / (depth + 1);

                ctx.fillStyle =
                    `rgb(${255-depth/4},0,0)`;

                ctx.fillRect(
                    x,
                    canvas.height/2 - wallHeight/2,
                    1,
                    wallHeight
                );

                break;
            }
        }
    }
}

function drawMonster() {

    const dx = monster.x - player.x;
    const dy = monster.y - player.y;

    const distance = Math.hypot(dx, dy);

    const angleToMonster =
        Math.atan2(dy, dx) - player.angle;

    if (Math.abs(angleToMonster) < 0.5) {

        const size = 2000 / distance;

        const screenX =
            canvas.width/2 +
            Math.tan(angleToMonster) * 500;

        ctx.fillStyle = "white";

        ctx.beginPath();
        ctx.arc(
            screenX,
            canvas.height/2,
            size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "black";

        ctx.beginPath();
        ctx.arc(screenX - size/3,
            canvas.height/2 - size/5,
            size/8,
            0,
            Math.PI*2);

        ctx.arc(screenX + size/3,
            canvas.height/2 - size/5,
            size/8,
            0,
            Math.PI*2);

        ctx.fill();
    }
}

function draw() {

    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // sky
    ctx.fillStyle = "#111";
    ctx.fillRect(0, 0, canvas.width, canvas.height/2);

    // floor
    ctx.fillStyle = "#222";
    ctx.fillRect(
        0,
        canvas.height/2,
        canvas.width,
        canvas.height/2
    );

    if (started) {

        castRays();
        drawMonster();

        // crosshair
        ctx.strokeStyle = "white";

        ctx.beginPath();

        ctx.moveTo(
            canvas.width/2 - 10,
            canvas.height/2
        );

        ctx.lineTo(
            canvas.width/2 + 10,
            canvas.height/2
        );

        ctx.moveTo(
            canvas.width/2,
            canvas.height/2 - 10
        );

        ctx.lineTo(
            canvas.width/2,
            canvas.height/2 + 10
        );

        ctx.stroke();
    }
}

function loseGame() {

    gameOver = true;

    const msg = document.getElementById("message");

    msg.style.display = "block";
    msg.innerText = "TUNG TUNG TUNG SAHUR GOT YOU";
}

function winGame() {

    gameOver = true;

    const msg = document.getElementById("message");

    msg.style.display = "block";
    msg.innerText = "YOU ESCAPED";
}

function gameLoop() {

    update();
    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
